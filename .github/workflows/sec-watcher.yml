name: SEC Watcher

on:
  schedule:
    # Every 15 minutes, weekdays, 12:00-23:00 UTC (8 AM - 7 PM ET)
    # Covers the SEC's 6 AM - 10 PM ET filing acceptance window.
    - cron: '*/15 12-23 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sec-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run watcher
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_ALERTS_PER_RUN: '20'
        run: python3 sec_watcher.py

      - name: Commit state + 8-K events if changed
        run: |
          # Stage each path independently — `git add state.json events/` fatals
          # (exit 128) when events/ doesn't exist yet, which killed every run
          # between the 8-K-feed merge and the first analyzed 8-K (2026-07-02).
          # events/.gitkeep now pins the directory, and the guard makes the
          # step immune even if it's ever removed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          [ -d events ] && git add events
          if ! git diff --cached --quiet; then
            git commit -m "chore: update watcher state + 8-K events [skip ci]"
            git push
          fi
