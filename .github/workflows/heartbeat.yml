name: Heartbeat Digest

on:
  schedule:
    # Mondays at 13:00 UTC (9 AM ET) — weekly health check + 7-day digest.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post heartbeat
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 heartbeat.py
